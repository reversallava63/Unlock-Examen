  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #f1ede4; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    header {
      flex: none; text-align: center;
      padding: 20px 16px 16px;
      padding-top: calc(20px + env(safe-area-inset-top, 0px));
    }
    h1 {
      font-family: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
      font-variation-settings: "opsz" 144;
      font-weight: 300;
      font-size: clamp(30px, 5vw, 56px);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    h1 em { font-style: italic; color: #cfd6e6; }

    /* Video area: fills everything under the title */
    main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #000; }
    #yt, main iframe {
      position: absolute; left: 0; width: 100%;
      top: -64px; height: calc(100% + 64px);   /* pushes YouTube's title bar out of view */
      border: 0; pointer-events: none;
    }
    /* Invisible layer above the video: blocks clicks on YouTube's UI and catches the first tap */
    #shield { position: absolute; inset: 0; z-index: 2; cursor: default; }
  </style>
</head>
<body>

  <header>
    <h1>Unlock <em>Examen</em></h1>
  </header>

  <main>
    <div id="yt"></div>
    <div id="shield"></div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var VIDEO = "dQw4w9WgXcQ";
    var player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("yt", {
        videoId: VIDEO,
        playerVars: {
          autoplay: 1, mute: 1,            // browsers only allow autoplay when muted
          controls: 0, disablekb: 1, fs: 0,
          modestbranding: 1, rel: 0, iv_load_policy: 3,
          playsinline: 1, loop: 1, playlist: VIDEO,
          origin: location.origin
        },
        events: {
          onReady: function (e) { e.target.mute(); e.target.playVideo(); }
        }
      });
    }

    // First click / tap / key press: unmute, set volume to max, make sure it plays
    function unlockSound() {
      if (!player || !player.unMute) return;
      player.unMute();
      player.setVolume(100);
      player.playVideo();
      ["pointerdown", "touchstart", "keydown", "click"].forEach(function (t) {
        document.removeEventListener(t, unlockSound, true);
      });
    }
    ["pointerdown", "touchstart", "keydown", "click"].forEach(function (t) {
      document.addEventListener(t, unlockSound, true);
    });
  </script>
</body>
